# Site settings
title: "800m Athletics Blog"
description: "Totul despre proba de 800 metri - tehnici, antrenament, strategie și performanță"
baseurl: ""
url: ""

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/
future: true

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Coach 800m"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
